<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#050505" />
<title>Ayet Studio — 4K MP4</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* BÖLÜM C1: DEĞİŞKENLER VE RESET */
:root {
  --bg: #050505; /* Tam siyah değil, gözü yormayan çok koyu bir siyah */
  --bg-soft: #111111; 
  --krem: #ffffff; /* Beyaz */
  --altin: #c9a227;
  --altin-soft: #e0bb4a;
  --metin: #ffffff;
  --metin-soluk: #a0a0a0;
  --cizgi: rgba(201, 162, 39, 0.4);
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--metin); font-family: "Inter", system-ui, sans-serif; font-size: 15px; overscroll-behavior: none; }
button { font-family: inherit; cursor: pointer; border: 1px solid var(--cizgi); background: var(--bg-soft); color: var(--metin); border-radius: var(--radius); padding: 10px 14px; font-size: 14px; transition: background .2s, border-color .2s; }
button:hover { background: #1d1a10; border-color: var(--altin); }
button.primary { background: linear-gradient(135deg, var(--altin), var(--altin-soft)); color: #1a1405; font-weight: 700; border: none; }
button.secondary { background: transparent; border-color: var(--altin); color: var(--altin); }
button:disabled { opacity: .5; cursor: not-allowed; }
input, select { font-family: inherit; background: var(--bg-soft); border: 1px solid var(--cizgi); color: var(--metin); border-radius: 8px; padding: 8px 10px; font-size: 14px; width: 100%; }
h1, h2 { font-family: "Cormorant Garamond", serif; letter-spacing: .5px; }
h1 { font-size: 20px; }
h2 { font-size: 16px; color: var(--altin-soft); margin-bottom: 10px; }
.badge { font-size: 11px; background: var(--altin); color: var(--bg); padding: 2px 8px; border-radius: 20px; vertical-align: middle; margin-left: 6px; }
.hidden { display: none !important; }

/* BÖLÜM C2: LAYOUT VE RESPONSIVE */
#topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: var(--bg-soft); border-bottom: 1px solid var(--cizgi); gap: 12px; flex-wrap: wrap; }
#topbar .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
#app { display: grid; grid-template-columns: 280px 1fr 300px; gap: 16px; padding: 16px; height: calc(100vh - 64px); height: calc(100dvh - 64px); overflow: hidden; }
#panel-takip, #panel-ayarlar { overflow-y: auto; background: var(--bg-soft); border: 1px solid var(--cizgi); border-radius: var(--radius); padding: 14px; }
#panel-onizleme { display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
.preview-tabs { display: flex; gap: 8px; }
.preview-tabs button { flex: 1; }
.preview-tabs button.active { background: var(--altin); color: var(--bg); border-color: var(--altin); }
.canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; border-radius: var(--radius); overflow: hidden; min-height: 0; position: relative; }
#canvas-onizleme { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
#tabbar { display: none; }

@media (max-width: 900px) {
  #app { grid-template-columns: 1fr; padding: 12px; padding-bottom: 80px; height: calc(100vh - 64px); height: calc(100dvh - 64px); }
  #app > aside, #app > section { display: none; }
  #app > .tab-aktif { display: flex; flex-direction: column; }
  #panel-ayarlar.tab-aktif, #panel-takip.tab-aktif { display: block; }
  #tabbar { display: grid; grid-template-columns: repeat(3, 1fr); position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-soft); border-top: 1px solid var(--cizgi); padding: 6px; gap: 4px; z-index: 20; }
  #tabbar button { background: transparent; border: none; padding: 10px 6px; font-size: 12px; color: var(--metin-soluk); }
  #tabbar button.active { color: var(--altin); font-weight: 700; }
}
@media (max-height: 500px) and (orientation: landscape) {
  #topbar { padding: 6px 12px; }
  #app { height: calc(100vh - 48px); height: calc(100dvh - 48px); padding: 8px; gap: 8px; grid-template-columns: 240px 1fr 260px; }
  #tabbar { display: none !important; }
  #app > aside, #app > section { display: flex !important; }
}

/* BÖLÜM C3: BİLEŞENLER */
.form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.form-row label { font-size: 12px; color: var(--metin-soluk); }
.info-box { padding: 10px 12px; background: var(--bg); border: 1px solid var(--cizgi); border-radius: 8px; margin-bottom: 10px; font-size: 13px; }
.info-box.highlight { border-color: var(--altin); background: linear-gradient(135deg, rgba(201,162,39,.12), transparent); }
.info-box b { color: var(--altin-soft); }
#takip-siradaki button { width: 100%; font-size: 12px; padding: 8px; }
.copy-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.copy-grid button { font-size: 12px; padding: 8px; }
.copy-grid button.wide { grid-column: 1 / -1; }
#overlay { position: fixed; inset: 0; background: rgba(5,5,5,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 100; color: var(--krem); }
.spinner { width: 48px; height: 48px; border: 4px solid rgba(201,162,39,.25); border-top-color: var(--altin); border-radius: 50%; animation: don .8s linear infinite; }
@keyframes don { to { transform: rotate(360deg); } }
#overlay-progress { width: 260px; height: 6px; background: rgba(201,162,39,.2); border-radius: 3px; overflow: hidden; }
#overlay-progress::after { content: ''; display: block; height: 100%; width: var(--ilerleme, 0%); background: var(--altin); transition: width .2s; }

/* YENİ: JSON Yapıştırma Modalı */
#modal-yapistir { position: fixed; inset: 0; background: rgba(5,5,5,.9); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
.modal-icerik { background: var(--bg-soft); border: 1px solid var(--altin); border-radius: var(--radius); padding: 20px; width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
#txt-json { width: 100%; height: 250px; resize: vertical; font-family: monospace; font-size: 13px; background: var(--bg); border: 1px solid var(--cizgi); color: var(--metin); padding: 10px; border-radius: 8px; line-height: 1.4; }
#txt-json:focus { outline: none; border-color: var(--altin); }
</style>
</head>

<!-- BÖLÜM H1: HTML YAPISI -->
<header id="topbar">

    <button id="btn-json-yukle">📂 Dosyadan Yükle</button>

    <button id="btn-png-indir" class="secondary">🖼️ PNG</button>
    <button id="btn-onizle" class="secondary">▶️ Oynat</button>
    <button id="btn-video-uret" class="primary">🎬 Video Üret</button>
  </div>
</header>

<main id="app">

    <button id="btn-geri-al" class="secondary" style="margin-top:8px;width:100%">↶ Son İşareti Geri Al</button>
  </aside>

  <section id="panel-onizleme">

      <button data-orient="yatay">16:9 Yatay</button>

  </section>

  <aside id="panel-ayarlar">

    <div class="form-row"><label>Ses seviyesi</label><input type="range" id="rng-ses" min="0" max="1" step="0.05" value="0.3" /></div>

    <h2>⚙️ Kodlama</h2>
    <div class="form-row"><label>Bit hızı (Mbps)</label><input type="number" id="inp-bitrate" value="40" min="10" max="80" /></div>
    <div class="form-row">
      <label>Codec</label>
      <select id="sel-codec">
        <option value="avc1.640033">H.264 (uyumlu)</option>
        <option value="hvc1.1.6.L150.B0">H.265 (küçük dosya)</option>
      </select>
    </div>
    <div class="form-row"><label>Çözünürlük</label><select id="sel-kalite"><option value="4k">4K (3840×2160 / 2160×3840)</option><option value="1080">Full HD 1080p (hafif)</option></select></div>
    <div class="form-row"><label>Süre (saniye)</label><input type="number" id="inp-sure" value="35" min="10" max="120" /></div>
    <h2>🎨 Tasarım Editörü (<span id="lbl-format" style="color:var(--altin)">Dikey</span>)</h2>
    <div class="form-row">
      <label>Başlık Boyutu <span id="val-baslik" style="float:right">50px</span></label>
      <input type="range" id="edt-baslik" min="20" max="150" value="50">
    </div>
    <div class="form-row">
      <label>Metin Boyutu (Ayet/Hadis/Dua) <span id="val-govde" style="float:right">35px</span></label>
      <input type="range" id="edt-govde" min="20" max="100" value="35">
    </div>
    <div class="form-row">
      <label>Kaynak Boyutu <span id="val-kaynak" style="float:right">25px</span></label>
      <input type="range" id="edt-kaynak" min="10" max="60" value="25">
    </div>
    <div class="form-row">
      <label>Satır Aralığı <span id="val-satir" style="float:right">1.6</span></label>
      <input type="range" id="edt-satir" min="1.2" max="3" step="0.1" value="1.6">
    </div>
    <div class="form-row">
      <label>Bloklar Arası Boşluk <span id="val-bosluk" style="float:right">60px</span></label>
      <input type="range" id="edt-bosluk" min="20" max="200" value="60">
    </div>
    
<h2>📋 Meta Kopyala</h2>
    <div class="copy-grid">
      <button data-copy="baslik">Başlık</button>
      <button data-copy="aciklama">Açıklama</button>
      <button data-copy="hashtag">Hashtag</button>
      <button data-copy="etiket">Etiketler</button>
      <button data-copy="sabitYorum" class="wide">Sabit Yorum</button>
    </div>
  </aside>
</main>

<nav id="tabbar">
  <button data-tab="panel-takip" class="active">📚 Ayetler</button>
  <button data-tab="panel-onizleme">🎬 Önizleme</button>
  <button data-tab="panel-ayarlar">⚙️ Ayarlar</button>
</nav>

<!-- YENİ: JSON Yapıştırma Modalı -->
<div id="modal-yapistir" class="hidden">
  <div class="modal-icerik">
    <h2>📋 JSON Metnini Yapıştır</h2>
    <p style="font-size:12px; color:var(--metin-soluk)">AI sohbet ekranından aldığınız JSON kodunu buraya yapıştırın.</p>
    <textarea id="txt-json" placeholder="Örnek:&#10;{&#10;  &quot;sure&quot;: &quot;Bakara 286&quot;,&#10;  &quot;ayet&quot;: { ... }&#10;}"></textarea>
    <div style="display: flex; gap: 10px; justify-content: flex-end;">
      <button id="btn-yapistir-iptal">İptal</button>
      <button id="btn-yapistir-yukle" class="primary">Yükle ve Önizle</button>
    </div>
  </div>
</div>

<div id="overlay" class="hidden">
  <div class="spinner"></div>
  <p id="overlay-mesaj">Kareler kodlanıyor…</p>
  <div id="overlay-progress"></div>
</div>

  try { const raw = localStorage.getItem(TAKIP_KEY); if (raw) state.takip = JSON.parse(raw); } catch {}

}

function sureGetir(no) { return SURE_LIST.find(s => s.no === Number(no)); }

/* BÖLÜM J3: AYET TAKİP MANTIĞI */
function sonIslenenGetir() { return state.takip.sonIslenen; }
function siradakiGetir() {
  const son = state.takip.sonIslenen;
  if (!son) return { sureNo: 1, ayetNo: 1, etiket: 'Fâtiha 1', sureAd: 'Fâtiha' };
  const [sureNo, ayetNo] = son.split('-').map(Number);
  const sure = sureGetir(sureNo);
  if (!sure) return { sureNo: 1, ayetNo: 1, etiket: 'Fâtiha 1', sureAd: 'Fâtiha' };
  if (ayetNo < sure.ayet) return { sureNo, ayetNo: ayetNo + 1, etiket: `${sure.ad} ${ayetNo + 1}`, sureAd: sure.ad };
  const sonraki = sureGetir(sureNo + 1);
  if (sonraki) return { sureNo: sureNo + 1, ayetNo: 1, etiket: `${sonraki.ad} 1`, sureAd: sonraki.ad };
  return { sureNo: 1, ayetNo: 1, etiket: 'Fâtiha 1', sureAd: 'Fâtiha' };
}
function sureSecenekleriniDoldur(selSure) {
  selSure.innerHTML = SURE_LIST.map(s => `<option value="${s.no}">${s.no}. ${s.ad} (${s.ayet} ayet)</option>`).join('');
}
function ayetSecenekleriniDoldur(selAyet, sureNo) {
  const sure = sureGetir(sureNo);
  if (!sure) return;
  selAyet.innerHTML = Array.from({ length: sure.ayet }, (_, i) => `<option value="${i + 1}">${i + 1}. ayet</option>`).join('');
}
function isaretleFromSelect() {
  const sureNo = Number(document.querySelector('#sel-sure').value);
  const ayetNo = Number(document.querySelector('#sel-ayet').value);
  if (!sureNo || !ayetNo) return;
  ayetIsaretle(sureNo, ayetNo);
  document.dispatchEvent(new CustomEvent('takip-guncellendi'));
}

function ayetGeriAl() {
  const l = state.takip.islenenler;
  if (!l.length) return alert('Geri alınacak kayıt yok.');
  l.pop(); state.takip.sonIslenen = l[l.length - 1] || null; takipKaydet();
}

/* BÖLÜM J4: JSON YÜKLE / KAYDET / YAPIŞTIR */
// Ortak JSON uygulama fonksiyonu
// YENİ KOD (Akıllı JSON Tanıyıcı)
function jsonVerisiniUygula(data) {
  if (!data) return false;

  let videoObj = null;
  let jsonObj = null;

  // Durum 1: Doğrudan tek bir video objesi yapıştırılmışsa (Sizin gönderdiğiniz gibi)
  if (data.sure && data.ayet) {
    videoObj = data;
    jsonObj = { videolar: [data], sabitYorum: data.sabitYorum || '' };
  } 
  // Durum 2: Doğrudan bir dizi yapıştırılmışsa
  else if (Array.isArray(data) && data.length > 0) {
    videoObj = data[0];
    jsonObj = { videolar: data, sabitYorum: '' };
  }
  // Durum 3: Standart şablon (videolar dizisi içeren)
  else if (data.videolar && Array.isArray(data.videolar) && data.videolar.length > 0) {
    videoObj = data.videolar[0];
    jsonObj = data;
  }
  // Durum 4: Geçersiz format
  else {
    alert('Geçersiz JSON formatı. Lütfen geçerli bir ayet şablonu yapıştırdığınızdan emin olun.');
    return false;
  }

  state.json = jsonObj;
  state.aktifVideo = videoObj;
  jsonKaydet(jsonObj);
  
  if (jsonObj.ayarlar?.sureSaniye) {
    document.querySelector('#inp-sure').value = jsonObj.ayarlar.sureSaniye;
  }
  
  onizlemeCiz();
  takipGuncelle();
  return true;
}

function jsonDosyasiSec() {
  return new Promise((resolve) => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = () => {
      const file = inp.files[0];
      if (!file) return resolve(null);
      const reader = new FileReader();
      reader.onload = () => {
        try { const data = JSON.parse(reader.result); resolve(data); }
        catch (e) { alert('JSON okunamadı: ' + e.message); resolve(null); }
      };
      reader.readAsText(file);
    };
    inp.click();
  });
}

function jsonIndir() {
  if (!state.json) return alert('Önce JSON yükleyin.');
  const blob = new Blob([JSON.stringify(state.json, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `ayet-${state.json?.videolar?.[0]?.sure || 'sablon'}.json`; a.click();
  URL.revokeObjectURL(url); jsonKaydet(state.json);
}

/* BÖLÜM J5: META KOPYALAMA */
async function kopyala(tur) {
  const v = state.aktifVideo;
  let metin = '';
  switch (tur) {
    case 'baslik': metin = v?.youtube?.baslik || ''; break;
    case 'aciklama': metin = v?.youtube?.aciklama || ''; break;
    case 'hashtag': metin = (v?.youtube?.hashtagler || []).join(' '); break;
    case 'etiket': metin = (v?.youtube?.etiketler || []).join(', '); break;
    case 'sabitYorum': metin = state.json?.sabitYorum || ''; break;
  }
  if (!metin) return alert('İçerik boş.');
  try {
    await navigator.clipboard.writeText(metin);
    const b = document.querySelector(`[data-copy="${tur}"]`);
    if (b) { const eski = b.textContent; b.textContent = '✓ Kopyalandı'; setTimeout(() => b.textContent = eski, 1200); }
  } catch { alert('Kopyalanamadı.'); }
}

const ONIZ_K = 0.75;
const GIRIS_SURE = 0.8;

}
function zamanHesapla(toplamSure) {

}
async function fontlariYukle() {
  try {
    await Promise.all(['700 40px Amiri', '40px Amiri', '600 40px "Cormorant Garamond"', '700 40px "Cormorant Garamond"', 'italic 600 40px "Cormorant Garamond"']

function sar(ctx, metin, maxGen) { // ölçüm ve çizim aynı satırları kullanır
  const out = []; let satir = '';
  for (const k of String(metin || '').split(/\s+/).filter(Boolean)) {
    const test = satir ? satir + ' ' + k : k;
    if (satir && ctx.measureText(test).width > maxGen) { out.push(satir); satir = k; } else satir = test;
  }

}
function bloklarHazirla(ctx, v, w, orient, O, sc) {
  const px = (n) => Math.round(n * sc), bosluk = px(O.bosluk);
  const maxG = w - w * (orient === 'dikey' ? 0.13 : 0.17) * 2;
  const FA = '"Amiri", serif', FC = '"Cormorant Garamond", serif';
  const L = [];
  const M = (metin, font, renk, lh, alt, zaman, tur = 'metin') => {

  const gov = `600 ${px(O.govde)}px ${FC}`, kay = `600 ${px(O.kaynak)}px ${FC}`, arF = `${px(O.baslik * 1.3)}px ${FA}`;

const duzenCache = { key: null, v: null, val: null };

  if (duzenCache.key === key && duzenCache.v === v) return duzenCache.val;

  const ust = h * (orient === 'dikey' ? 0.135 : 0.2), alt = h * (orient === 'dikey' ? 0.8 : 0.9), bos = alt - ust; // Shorts arayüzü için alt boşluk

function ciz(ctx, w, h, v, orient, t = 30, toplamSure = 35) {

  if (!v) return alert('Önce bir ayet yükleyin.');
  if (typeof VideoEncoder === 'undefined') return alert('Bu tarayıcı video kodlamayı (WebCodecs) desteklemiyor. Güncel Chrome veya Edge kullanın.');
  const overlay = document.querySelector('#overlay'), mesaj = document.querySelector('#overlay-mesaj'), progress = document.querySelector('#overlay-progress');
  overlay.classList.remove('hidden'); mesaj.textContent = 'Hazırlanıyor…'; progress.style.setProperty('--ilerleme', '0%');
  let vEnc = null, aEnc = null;
  try {
    await muxerYukle(); await fontlariYukle();
    const { w, h } = boyutGetir(orient, state.kalite === '4k' ? 2 : 1), fps = 30;
    const sure = Number(document.querySelector('#inp-sure')?.value || 35);
    const bitHizi = Number(document.querySelector('#inp-bitrate').value || 40) * 1_000_000;
    let codec = document.querySelector('#sel-codec').value;
    const cfg = { codec, width: w, height: h, bitrate: bitHizi, framerate: fps, latencyMode: 'quality', hardwareAcceleration: donanim, ...(codec.startsWith('hvc1') ? { hevc: { format: 'hevc' } } : { avc: { format: 'avc' } }) };
    let sup = await VideoEncoder.isConfigSupported(cfg);
    if (!sup.supported && codec.startsWith('hvc1')) {
      cfg.codec = codec = 'avc1.640033'; sup = await VideoEncoder.isConfigSupported(cfg);
      alert('H.265 bu cihazda desteklenmiyor, H.264 kullanılacak.');
    }
    if (!sup.supported) throw new Error(`Bu cihaz ${w}×${h} çözünürlükte kodlama yapamıyor. "Full HD" seçeneğini deneyin.`);

    let sesVar = !!(state.muzik && document.querySelector('#chk-muzik').checked);
    if (sesVar) {
      const as = typeof AudioEncoder !== 'undefined' && (await AudioEncoder.isConfigSupported({ codec: 'mp4a.40.2', sampleRate: 48000, numberOfChannels: 2, bitrate: 160000 })).supported;
      if (!as) { sesVar = false; alert('Bu tarayıcı AAC ses kodlamayı desteklemiyor; video müziksiz üretilecek.'); }
    }

    const canvas = mk(w, h), ctx = canvas.getContext('2d');
    const muxer = new Muxer({
      target: new ArrayBufferTarget(),
      video: { codec: codec.startsWith('hvc1') ? 'hevc' : 'avc', width: w, height: h, frameRate: fps },
      audio: sesVar ? { codec: 'aac', numberOfChannels: 2, sampleRate: 48000 } : undefined,
      fastStart: 'in-memory',
    });
    let hata = null, parca = 0;
    vEnc = new VideoEncoder({ output: (c, m) => { parca++; muxer.addVideoChunk(c, m); }, error: (e) => { hata = e; } });
    vEnc.configure(cfg);
    if (sesVar) { mesaj.textContent = 'Ses hazırlanıyor…'; aEnc = await sesKodlayiciHazirla(state.muzik, muxer, sure, (e) => { hata = e; }); }

    mesaj.textContent = 'Kareler kodlanıyor…';
    const toplamKare = sure * fps;
    for (let i = 0; i < toplamKare; i++) {
      if (hata) throw hata;
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
      ciz(ctx, w, h, v, orient, i / fps, sure);
      const frame = new VideoFrame(canvas, { timestamp: Math.round(i / fps * 1_000_000) });
      vEnc.encode(frame, { keyFrame: i % (fps * 2) === 0 }); frame.close();
      while (vEnc.encodeQueueSize > 8) await new Promise(r => setTimeout(r, 10));
      if (i % 10 === 0) { progress.style.setProperty('--ilerleme', `${i / toplamKare * 100}%`); await new Promise(r => setTimeout(r, 0)); }
    }
    mesaj.textContent = 'Dosya hazırlanıyor…';
    await vEnc.flush(); if (aEnc) await aEnc.flush();
    if (hata) throw hata;
    if (!parca) {
      if (donanim === 'prefer-hardware') { mesaj.textContent = 'Donanım kodlayıcı yanıt vermedi, yazılım kodlayıcı deneniyor…'; return await videoUret(orient, 'prefer-software'); }
      throw new Error('Kodlayıcı hiç video karesi üretmedi. "Full HD" ve H.264 seçip tekrar deneyin.');
    }
    muxer.finalize();
    indir(new Blob([muxer.target.buffer], { type: 'video/mp4' }), `ayet-${v.sure || 'video'}-${orient}.mp4`);
    const tani = ayetTani(v.sure);
    if (tani) { ayetIsaretle(tani.sureNo, tani.ayetNo); document.dispatchEvent(new CustomEvent('takip-guncellendi')); }
  } catch (e) {
    console.error(e); alert('Video üretilemedi: ' + (e?.message || e));
  } finally {
    overlay.classList.add('hidden');
    for (const x of [vEnc, aEnc]) { try { if (x && x.state !== 'closed') x.close(); } catch {} }
  }
}

async function sesKodlayiciHazirla(file, muxer, sure, onErr) {
  const arrayBuf = await file.arrayBuffer();
  const audioCtx = new OfflineAudioContext(2, 48000 * sure, 48000);
  const audioBuf = await audioCtx.decodeAudioData(arrayBuf);
  const src = audioCtx.createBufferSource(); src.buffer = audioBuf; src.loop = true;
  const vol = Number(document.querySelector('#rng-ses').value), gain = audioCtx.createGain();
  gain.gain.setValueAtTime(vol, 0); gain.gain.setValueAtTime(vol, Math.max(0, sure - 1.5)); gain.gain.linearRampToValueAtTime(0, sure); // son 1,5 sn yumuşak bitiş
  src.connect(gain).connect(audioCtx.destination); src.start(0);
  const rendered = await audioCtx.startRendering();
  const aEnc = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: onErr });
  aEnc.configure({ codec: 'mp4a.40.2', sampleRate: 48000, numberOfChannels: 2, bitrate: 160000 });
  const ch0 = rendered.getChannelData(0), ch1 = rendered.getChannelData(1), kare = 1024;
  for (let i = 0; i < ch0.length; i += kare) {
    const adet = Math.min(kare, ch0.length - i), data = new Float32Array(adet * 2);
    data.set(ch0.subarray(i, i + adet), 0); data.set(ch1.subarray(i, i + adet), adet); // f32-planar: önce sol, sonra sağ kanal
    const ad = new AudioData({ format: 'f32-planar', sampleRate: 48000, numberOfFrames: adet, numberOfChannels: 2, timestamp: Math.round(i / 48000 * 1_000_000), data });
    aEnc.encode(ad); ad.close();
    if (aEnc.encodeQueueSize > 64) await new Promise(r => setTimeout(r, 0));
  }
  return aEnc;
}

function indir(blob, ad) {
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = ad; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

/* BÖLÜM J9: UI BAĞLAYICI */
function bindUI() {
  takipYukle(); // seçimler yüklenmeden önce kayıtlı takip okunmalı
  // Dosyadan Yükle
  document.querySelector('#btn-json-yukle').onclick = async () => {
    const data = await jsonDosyasiSec();
    if (data) jsonVerisiniUygula(data);
  };

  // YENİ: Modal Açma / Kapatma
  const modal = document.querySelector('#modal-yapistir');
  const txtJson = document.querySelector('#txt-json');
  
  document.querySelector('#btn-json-yapistir').onclick = () => {
    modal.classList.remove('hidden');
    txtJson.value = ''; // Temizle
    txtJson.focus();
  };

  document.querySelector('#btn-yapistir-iptal').onclick = () => {
    modal.classList.add('hidden');
  };

  document.querySelector('#btn-yapistir-yukle').onclick = () => {
    const metin = txtJson.value.trim();
    if (!metin) return alert('Lütfen JSON metnini yapıştırın.');
    try {
      const data = JSON.parse(metin);
      if (jsonVerisiniUygula(data)) {
        modal.classList.add('hidden'); // Başarılıysa kapat
      }
    } catch (e) {
      alert('Geçersiz JSON formatı. Lütfen kontrol edin.\nHata: ' + e.message);
    }
  };

  document.querySelector('#btn-json-kaydet').onclick = jsonIndir;
  
  document.querySelector('#btn-png-indir').onclick = async () => {
    if (!state.aktifVideo) return alert('Önce JSON yükleyin.');
    await fontlariYukle();
    const { w, h } = boyutGetir(state.aktifOrient, state.kalite === '4k' ? 2 : 1);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const sure = Number(document.querySelector('#inp-sure').value || 35);
    ciz(c.getContext('2d'), w, h, state.aktifVideo, state.aktifOrient, sure, sure);
    c.toBlob((b) => indir(b, `onizleme-${state.aktifVideo.sure || 'ayet'}-${state.aktifOrient}.png`), 'image/png');
  };

  let onizlemeTimer = null;
  document.querySelector('#btn-onizle').onclick = () => {
    if (onizlemeTimer) { clearInterval(onizlemeTimer); onizlemeTimer = null; document.querySelector('#btn-onizle').textContent = '▶️ Oynat'; return; }
    if (!state.aktifVideo) return alert('Önce JSON yükleyin.');
    
    const btn = document.querySelector('#btn-onizle');
    btn.textContent = '⏹️ Durdur';
    const canvas = document.querySelector('#canvas-onizleme');
    const ctx = canvas.getContext('2d');
    const { w, h } = boyutGetir(state.aktifOrient, ONIZ_K);
    const toplamSure = Number(document.querySelector('#inp-sure')?.value || 35);
    
    canvas.width = w; canvas.height = h;

    let baslangic = performance.now();
    onizlemeTimer = setInterval(() => {
      let gecen = (performance.now() - baslangic) / 1000;
      if (gecen > toplamSure) gecen = toplamSure;
      
      ciz(ctx, w, h, state.aktifVideo, state.aktifOrient, gecen, toplamSure);
      
      if (gecen >= toplamSure) {
        clearInterval(onizlemeTimer); onizlemeTimer = null; btn.textContent = '▶️ Oynat';
      }
    }, 1000 / 30);
  };

  document.querySelector('#btn-video-uret').onclick = () => videoUret();

  document.querySelectorAll('.preview-tabs button').forEach(b => {
    b.onclick = () => {
      if (onizlemeTimer) { clearInterval(onizlemeTimer); onizlemeTimer = null; document.querySelector('#btn-onizle').textContent = '▶️ Oynat'; }
      document.querySelectorAll('.preview-tabs button').forEach(x => x.classList.remove('active'));
      b.classList.add('active'); state.aktifOrient = b.dataset.orient; onizlemeCiz();
    };
  });

  document.querySelectorAll('[data-copy]').forEach(b => { b.onclick = () => kopyala(b.dataset.copy); });
  document.querySelector('#inp-muzik').onchange = (e) => { state.muzik = e.target.files[0] || null; if (state.muzik) document.querySelector('#chk-muzik').checked = true; };

  document.querySelectorAll('#tabbar button').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('#tabbar button').forEach(x => x.classList.remove('active')); b.classList.add('active');
      document.querySelectorAll('#app > aside, #app > section').forEach(p => p.classList.remove('tab-aktif'));
      document.querySelector('#' + b.dataset.tab).classList.add('tab-aktif');
    };
  });

  const selSure = document.querySelector('#sel-sure'), selAyet = document.querySelector('#sel-ayet');
  sureSecenekleriniDoldur(selSure);
  const sirada = siradakiGetir();
  selSure.value = String(sirada.sureNo); ayetSecenekleriniDoldur(selAyet, sirada.sureNo); selAyet.value = String(sirada.ayetNo);

  selSure.onchange = () => { ayetSecenekleriniDoldur(selAyet, Number(selSure.value)); selAyet.value = '1'; };
  document.querySelector('#btn-isaretle').onclick = isaretleFromSelect;
  document.querySelector('#btn-geri-al').onclick = () => { ayetGeriAl(); document.dispatchEvent(new CustomEvent('takip-guncellendi')); };

  document.querySelector('#takip-siradaki').addEventListener('click', (e) => {
    if (e.target.tagName === 'BUTTON') {
      const s = siradakiGetir();
      selSure.value = String(s.sureNo); ayetSecenekleriniDoldur(selAyet, s.sureNo); selAyet.value = String(s.ayetNo);
      aiPromptKopyala(s);
    }
  });

  document.querySelector('#inp-sure').addEventListener('change', () => {
    if (!onizlemeTimer) onizlemeCiz();
  });

  // Kalite seçimi (mobilde otomatik Full HD)
  const selK = document.querySelector('#sel-kalite'), inpB = document.querySelector('#inp-bitrate');
  const kaliteUygula = (k) => {
    state.kalite = k; inpB.value = k === '4k' ? 40 : 14;
    document.querySelector('#badge-kalite').textContent = k === '4k' ? '4K MP4' : '1080p MP4';
  };
  selK.onchange = () => kaliteUygula(selK.value);
  selK.value = (matchMedia('(pointer:coarse)').matches || innerWidth < 900) ? '1080' : '4k';
  kaliteUygula(selK.value);

  // EDİTÖR BAĞLANTILARI
  function editorGuncelle() {
    document.querySelector('#lbl-format').textContent = state.aktifOrient === 'dikey' ? 'Dikey (9:16)' : 'Yatay (16:9)';
    const ed = state.editor[state.aktifOrient];
    ['baslik', 'govde', 'kaynak', 'satir', 'bosluk'].forEach(k => {
      document.querySelector(`#edt-${k}`).value = ed[k];
      document.querySelector(`#val-${k}`).textContent = ed[k] + (k === 'satir' ? '' : 'px');
    });
  }

  ['baslik', 'govde', 'kaynak', 'satir', 'bosluk'].forEach(k => {
    document.querySelector(`#edt-${k}`).addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      state.editor[state.aktifOrient][k] = val;
      document.querySelector(`#val-${k}`).textContent = val + (k === 'satir' ? '' : 'px');
      if (onizlemeTimer) { clearInterval(onizlemeTimer); onizlemeTimer = null; document.querySelector('#btn-onizle').textContent = '▶️ Oynat'; }
      onizlemeCiz();
    });
  });

  // Formata tıklanınca editörü güncelle
  document.querySelectorAll('.preview-tabs button').forEach(b => {
    b.addEventListener('click', () => { setTimeout(editorGuncelle, 10); });
  });
  editorGuncelle(); // Başlangıçta yükle

  document.addEventListener('takip-guncellendi', takipGuncelle);
  takipGuncelle(); onizlemeCiz();
  fontlariYukle().then(() => onizlemeCiz());
  try { const kayit = localStorage.getItem(STORAGE_KEY); if (kayit) jsonVerisiniUygula(JSON.parse(kayit)); } catch {}
}

function takipGuncelle() {
  const son = sonIslenenGetir(), sirada = siradakiGetir();
  const elSon = document.querySelector('#takip-son'), elSir = document.querySelector('#takip-siradaki');
  if (elSon) elSon.innerHTML = `<b>Son işlenen:</b> ${son || '—'}`;
  if (elSir) elSir.innerHTML = `<b>🎯 Sıradaki:</b> ${sirada.etiket}<br><button class="primary" style="margin-top:8px">▶️ Bu Ayet İçin AI Prompt</button>`;
}

async function aiPromptKopyala(s) {
  const prompt = `Sen bir İslami içerik üreticisisin. Aşağıdaki ayet için JSON şablonunu doldur. Sadece JSON döndür.\n\nSIRADAKİ AYET: ${s.sureAd} ${s.ayetNo}\nÖNCEKİ: ${sonIslenenGetir() || 'yok'}\n\nKURALLAR:\n1. BAŞLIK: 60-70 karakter, duygu kancası + konu + "| Sure AyetNo" + 1 emoji.\n2. AÇIKLAMA 5 bölüm: kanca (ilk 100 karakter), ayet+hadis+dua tam metin, bağlam (iniş yeri+sebebi+fazileti+hadis ref), kaynaklar, CTA.\n3. HASHTAG: 3-5 tane (geniş+konu+format+marka). Başlıkta # YOK.\n4. ETİKETLER: 10-15, virgülle, geniş + uzun kuyruk.\n5. BAĞLAM: gerçek esbâb-ı nüzûl, emin değilsen "rivayet edilir" de.\n\nFormat:\n{\n  "sure": "${s.sureAd} ${s.ayetNo}",\n  "besmele": { "arapca": "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ", "turkce": "Rahmân ve Rahîm olan Allah'ın adıyla" },\n  "ayet": { "baslik": "...", "arapca": "...", "turkce": "...", "kaynak": "..." },\n  "hadis": { "baslik": "...", "metin": "...", "kaynak": "..." },\n  "dua": { "baslik": "...", "metin": "...", "kaynak": "...", "amin": "آمِين" },\n  "baglam": { "inisYeri": "Mekke|Medine", "inisSebebi": "...", "fazileti": "...", "hadisReferans": "..." },\n  "kaynaklar": { "meal": "Diyanet İşleri Başkanlığı", "hadis": "...", "ses": "Telifsiz", "gorsel": "Özgün tasarım" },\n  "youtube": { "baslik": "...", "aciklama": "...", "hashtagler": ["..."], "etiketler": ["..."] }\n}`;
  try { await navigator.clipboard.writeText(prompt); alert('✓ AI prompt kopyalandı.'); } catch { alert('Kopyalanamadı.'); }
}
